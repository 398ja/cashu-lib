name: release-please

# `branches:` is a filter that belongs inside an event, not an event itself. Commit 3733e21
# ("simplify branch trigger configuration") replaced the three real triggers with a bare
# `branches:` key, which matches no event, so GitHub had nothing to start the workflow from and
# every run failed instantly -- before any job, with an empty step list. Releases have not been
# cut from this workflow since.
#
# The job's own `if` expects push, workflow_dispatch and workflow_run, which is what these were
# and what it needs to behave as written.
on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    # Run on direct pushes to main, manual dispatch, or after CI completes successfully on main
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          command: manifest
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Use custom PAT to authenticate release-please
          token: ${{ secrets.RP_TOKEN }}
