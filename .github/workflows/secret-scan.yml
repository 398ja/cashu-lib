name: Secret scan

# AppSec review finding L-4: no repository in the cashu ecosystem scans for committed
# credentials. The dependency scan covers packages, not secrets, so nothing would catch a key
# pasted into a config file or a test fixture.
#
# An entropy-based sweep during the review found only one hit across all six Java repositories —
# a deliberate Playwright fixture in cashu-mint whose private key is literally 1. So there is
# nothing to clean up today. That is luck holding rather than a control, and luck does not
# survive the next contributor in a hurry.
#
# Uses the gitleaks binary rather than gitleaks-action: the action requires a paid GITLEAKS_LICENSE
# for organisation-owned repositories, which these are. The binary is MIT-licensed with no such
# restriction, and invoking it directly also pins the version rather than tracking a tag.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Weekly. A secret does not have to be committed today to be worth finding today.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Scan history, not just the working tree: a secret that was committed and then removed
          # is still a secret, because the object stays reachable.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # `detect` walks git history. Findings fail the job: a committed credential is not a
      # style issue, and unlike a dependency advisory there is no "not exploitable in our
      # configuration" reading of it — the secret is out and needs rotating.
      - name: Scan git history for secrets
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1 \
            --verbose

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
