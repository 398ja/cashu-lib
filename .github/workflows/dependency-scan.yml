name: Dependency vulnerability scan

# Audit finding L-34: no repository in the cashu ecosystem ran vulnerability scanning in CI.
# Dependabot proposes upgrades, but nothing failed a build when a known-vulnerable dependency
# was present, so a transitively-introduced CVE could land unnoticed. That is how the
# react-router advisories in mint-admin-web went unobserved until a manual audit.
#
# Trivy is used rather than OWASP dependency-check because it needs no NVD API key, caches its
# database, and understands both the Maven and npm trees in this repository.
#
# AppSec review finding L-4 (issue #266): the Maven scan was detecting nothing. `scan-type: fs`
# parses pom.xml, and in a multi-module project using dependencyManagement the coordinate and its
# version never appear in the same file -- the parent declares <version> inside
# <dependencyManagement>, which is not a dependency, and the child declares the dependency with
# no version. Per file Trivy sees either a managed version nothing depends on, or a dependency
# with no version, and neither is matchable against an advisory. The scan was green while
# Dependabot held 4 open alerts on the same tree.
#
# The fix is to scan something produced AFTER Maven resolves. CycloneDX emits an aggregate SBOM
# carrying resolved coordinates, and Trivy reads it natively. Adding flags to the fs scan could
# not have worked: no file in the tree holds the joined coordinate-plus-version fact.
#
# includeTestScope is deliberate. The open high advisory here is assertj-core, a test dependency,
# and the default SBOM omits test scope entirely -- so the obvious configuration would have
# reproduced the original bug on the very package that motivated the fix. Test dependencies run
# in CI and on developer machines, which is worth scanning even though they do not ship.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly, because a dependency does not have to change for it to become vulnerable: most
    # findings arrive as new advisories against versions that were already pinned.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  # Required by upload-sarif. Without it the upload returns 403, and because that step is
  # if: always() it ran and failed even when the scan itself passed, so the job was red
  # unconditionally from the first push. A check that cannot go green is worse than no check.
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Produces target/sbom.json: the aggregate, fully-resolved dependency set across every
      # module, test scope included. This is what makes Maven scanning work at all.
      - name: Generate CycloneDX SBOM
        run: >-
          ./mvnw -q -B -DskipTests
          org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
          -DoutputName=sbom -DoutputFormat=json -DincludeTestScope=true

      # Fail loudly if the SBOM is missing or implausibly small. Without this, a plugin change
      # that silently stopped emitting components would return the job to exactly the state
      # issue #266 describes: a green scan over an unresolved tree. The threshold sits well below
      # the current count so ordinary dependency churn never trips it.
      - name: Assert the SBOM actually resolved dependencies
        run: |
          set -euo pipefail
          test -f target/sbom.json || { echo "::error::No SBOM produced"; exit 1; }
          count=$(python3 -c "import json;print(len(json.load(open('target/sbom.json')).get('components',[])))")
          echo "SBOM components: $count"
          case "$count" in
            ''|*[!0-9]*)
              echo "::error::Could not read a component count from the SBOM."
              exit 1
              ;;
          esac
          if [ "$count" -lt 15 ]; then
            echo "::error::SBOM has only $count components; dependency resolution likely failed."
            echo "::error::Refusing to report a green scan over an unresolved tree (issue #266)."
            exit 1
          fi

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'sbom'
          scan-ref: 'target/sbom.json'
          # CRITICAL only blocks. A scan that only reports is a scan nobody reads, but a scan
          # that is always red is also a scan nobody reads, and it blocks merges as well.
          # CRITICAL+HIGH across a Spring Boot, Jackson and Netty tree produces findings most
          # weeks, none of which need be related to the change under review, so blocking on HIGH
          # would have trained everyone to ignore the check within about a month. HIGH findings
          # still surface: the SARIF upload below reports them in the Security tab, and the
          # weekly schedule means they arrive without needing a push.
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          # Anything listed here is suppressed with a reason and a review date.
          trivyignores: '.trivyignore'
          format: 'table'

      # Always produce SARIF so findings appear in the Security tab even when the step above
      # failed the build.
      - name: Generate SARIF report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'sbom'
          scan-ref: 'target/sbom.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload SARIF
        # Not on pull requests from forks: security-events: write is not granted there whatever
        # the workflow asks for, so the step can only fail. The push and schedule runs cover the
        # same code.
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
